name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Rubies the committed Gemfile.lock installs: breaker_machines 0.7.0 needs >= 3.3,
        # unicode-emoji 4.1.0 needs < 4.0.
        ruby: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # Tests only: the default rake task also runs RuboCop, which has pre-existing offenses.
      - run: bundle exec rake test
